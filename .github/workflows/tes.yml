# Test, lalu deploy — dan yang kedua nunggu yang pertama.
#
# ## Kenapa deploy-nya pindah ke sini
#
# `render.yaml` masang `autoDeploy: true`, tapi itu nggak pernah jalan: GitHub
# App Render nggak kepasang di akun ini, jadi GitHub nggak pernah ngabarin
# Render kalau ada push. Dibuktikan pada 21 Agu 2026 — PR #73 mendarat di
# `main`, empat belas menit lewat, nol deploy, dan enam menit ngetuk
# `/api/health` tiap 15 detik nggak nemu satu pun pergantian container.
#
# Gantinya: Deploy Hook Render — URL rahasia yang kalau diketuk bikin Render
# nge-deploy. Nggak butuh webhook, nggak butuh GitHub App.
#
# ## Yang berubah dari sebelumnya
#
# Dulu komentar di sini bilang "ini penanda, BUKAN gerbang" — Render deploy
# sendiri tanpa nungguin test, jadi commit yang test-nya merah tetap naik ke
# server. Sekarang jalur deploy-nya lewat sini, jadi urutannya bisa dibalik:
# test dulu, baru deploy. Commit yang merah berhenti di GitHub, nggak nyampe
# ke server yang dipakai teknisi di lokasi.
#
# Harganya beberapa menit tunda tiap deploy. Itu murah dibanding satu jam
# teknisi yang kadung berangkat bawa aplikasi rusak.
#
# ## Yang harus dipasang sekali
#
#   Render -> service -> Settings -> Deploy Hook -> salin URL-nya
#   gh secret set RENDER_DEPLOY_HOOK --body "<url-nya>"
#
# URL itu RAHASIA: siapa pun yang punya bisa memicu deploy. Makanya Secret,
# bukan Variable — Variable kebaca siapa saja yang bisa lihat repo.
name: Tes

on:
  push:
    branches:
      - main
      - chore/deploy-gratis-render
  pull_request:
  # Biar deploy bisa diulang TANPA bikin commit kosong.
  #
  # Deploy Render bisa gagal karena hal yang nggak ada hubungannya sama kode —
  # 1 Sep 2026 satu deploy timeout gara-gara jendela health check kehabisan
  # waktu, dan satu-satunya cara ngetuk ulang dari sini dulu ya push commit
  # baru. Commit kosong buat mancing CI itu justru yang dilarang di tempat lain
  # di repo ini, jadi jalurnya disediain di sini.
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Samain sama Dockerfile — beda versi PHP antara CI dan produksi
          # bikin CI hijau tapi servernya tetap error.
          #
          # 8.4 itu batas bawah beneran, bukan pilihan: config/database.php
          # nyebut `Pdo\Mysql::ATTR_SSL_CA`, dan kelas itu baru ada di 8.4.
          # Di 8.3 config-nya fatal waktu dimuat, jauh sebelum test pertama jalan.
          php-version: '8.4'
          extensions: pdo_sqlite, gd, intl, bcmath, zip, exif
          coverage: none

      - name: Cache dependency Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      # Test-nya jalan di SQLite in-memory (lihat phpunit.xml), jadi nggak perlu
      # nyalain MySQL di CI. Tapi .env harus tetap ada — `key:generate` nulisnya
      # ke situ, dan tanpa APP_KEY semua test yang nyentuh enkripsi/sesi jatuh.
      - run: cp .env.example .env
      - run: php artisan key:generate

      - run: php artisan test

  deploy:
    needs: phpunit
    runs-on: ubuntu-latest
    name: deploy ke Render

    # Cuma yang mendarat di `main`. Pull request nggak boleh nyentuh server
    # yang dipakai teknisi — dan `pull_request` dari fork nggak dikasih akses
    # ke secret sama sekali, jadi tanpa penjagaan ini job-nya bakal merah
    # tiap PR dari luar, bikin bising tanpa alasan.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'

    steps:
      # Dicek duluan, sebelum ngetuk apa pun: kalau hook-nya belum dipasang,
      # bilang cara masangnya. Jangan biarin curl gagal dengan pesan jaringan
      # yang nggak nunjuk ke mana-mana.
      - name: Pastiin Deploy Hook udah dipasang
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK belum dipasang. Render -> service -> Settings -> Deploy Hook, salin URL-nya, lalu: gh secret set RENDER_DEPLOY_HOOK --body \"<url>\""
            exit 1
          fi

      # URL-nya lewat `env`, BUKAN ditempel langsung ke dalam `run:`. Yang
      # ditempel `${{ }}` disalin mentah jadi teks skrip sebelum shell-nya
      # jalan — dan URL yang kebetulan bertanda kutip atau `;` bakal kebaca
      # sebagai perintah.
      #
      # `-f` bikin curl balik dengan kode gagal kalau HTTP-nya 4xx/5xx; tanpa
      # itu curl nganggap "berhasil" asal servernya jawab apa pun, termasuk
      # 401 karena hook-nya sudah diregenerasi.
      - name: Ketuk Deploy Hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          KODE=$(curl -s -o /dev/null -w '%{http_code}' -f -X POST "$HOOK") || {
            echo "::error::Render nolak ketukan (HTTP $KODE). Hook-nya mungkin sudah diregenerasi — salin ulang dari Settings dan pasang lagi secretnya."
            exit 1
          }
          echo "Render mulai deploy (HTTP $KODE)."

      # Gerbang yang dulu nggak ada, dan ketiadaannya mahal.
      #
      # Sebelum ini job-nya berhenti tepat sesudah ngetuk hook — mengetuk pintu
      # lalu pulang. Ketukan yang diterima Render itu cuma berarti "permintaan
      # deploy masuk antrean", BUKAN "versi barunya jalan". Build gagal, health
      # check timeout, container mati waktu boot: ketiganya tetap kelihatan
      # HIJAU di GitHub, dan satu-satunya cara tahu ya membuka dashboard.
      #
      # Akibatnya bukan teoretis: orang push perbaikan, lihat centang hijau,
      # lanjut kerja — sementara server masih menjalankan kode lama dan bug
      # yang dikira sudah beres masih hidup di lokasi.
      #
      # Yang diadu di sini `deploy.versi` dari GET /api/health, yaitu
      # RENDER_GIT_COMMIT yang disuntik Render ke container yang BENAR-BENAR
      # jalan. Selama container lama masih melayani, nilainya masih SHA lama —
      # jadi berubahnya nilai itu bukti pergantian, bukan tebakan.
      - name: Pastiin versi barunya beneran naik
        env:
          URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Variable RENDER_APP_URL belum dipasang, jadi nggak ada yang bisa dicek sesudah deploy. Isi URL publik servicenya (mis. https://namamu.onrender.com), TANPA garis miring di akhir: gh variable set RENDER_APP_URL --body \"https://<url>.onrender.com\""
            exit 1
          fi

          # Paket gratis Render bisa lagi tidur waktu diketuk, dan bangunnya
          # ~50 detik. `--max-time 90` biar percobaan pertama nggak dihitung
          # gagal cuma karena servicenya lagi molor.
          #
          # Batas totalnya 25 menit: build ulang 2-10 menit, plus jendela
          # health check Render yang 15 menit. Lebih pendek dari itu bakal
          # merah buat deploy yang sebenarnya masih sehat, cuma lambat.
          BATAS=$(( $(date +%s) + 25 * 60 ))
          JEDA=15
          SEBELUMNYA=""

          echo "Nungguin $URL nyajiin commit $SHA ..."

          while [ "$(date +%s)" -lt "$BATAS" ]; do
            BADAN=$(curl -s --max-time 90 "$URL/api/health" || true)
            VERSI=$(printf '%s' "$BADAN" | jq -r '.deploy.versi // empty' 2>/dev/null || true)

            if [ "$VERSI" = "$SHA" ]; then
              # TANPA `// empty`: di jq, `false // empty` menghasilkan empty
              # karena `//` menganggap `false` setara `null`. Dipakai di sini,
              # peringatan di bawah nggak akan pernah menyala justru waktu
              # nilainya `false` — satu-satunya keadaan yang bikin dia ada.
              ARSIP=$(printf '%s' "$BADAN" | jq -r '.deploy.arsip.awet' 2>/dev/null || true)
              echo "Versi $SHA udah jalan di server."

              # Bukan gerbang, cuma peringatan — dan sengaja dicetak di sini
              # karena ini satu-satunya saat ada yang pasti melihatnya.
              # `awet=false` artinya arsip & PDF sertifikat nulis ke disk
              # container, yang kehapus tiap deploy. Nggak ada error, nggak ada
              # yang hilang seketika; yang hilang berkas lama, diam-diam.
              if [ "$ARSIP" = "false" ]; then
                echo "::warning::Arsip masih nulis ke disk container (deploy.arsip.awet=false) — berkas yang udah diunggah kehapus tiap deploy. Setel ARSIP_DRIVER=s3 di Render → Environment."
              fi
              exit 0
            fi

            if [ -n "$VERSI" ] && [ "$VERSI" != "$SEBELUMNYA" ]; then
              echo "  masih versi lama ($VERSI), nunggu..."
              SEBELUMNYA="$VERSI"
            fi

            sleep "$JEDA"
          done

          echo "::error::25 menit lewat dan $URL masih belum nyajiin commit $SHA. Kemungkinannya: build gagal, health check timeout, atau container mati waktu boot — alasannya ada di Render → service → Events. Kalau deploy-nya sendiri kelihatan sukses di sana, cek RENDER_GIT_COMMIT kebaca atau nggak: endpoint health bakal nulis versi null selamanya kalau variabelnya kosong."
          exit 1
