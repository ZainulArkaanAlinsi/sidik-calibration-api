<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="SIDIK Calibration API — backend kalibrasi alat ukur dan sertifikat digital PT Sidik. Grafik titik ukur dengan error bar terhadap pita toleransi, dan tumpukan isometrik lima tahap jalur angka dari raw_measurements sampai sertifikat.">
  <title>SIDIK Calibration API</title>
  <desc>Bagian atas: identitas, dan enam titik ukur dengan error bar U terhadap pita toleransi — titik kelima keluar pita karena |error| ditambah U melewati batas. Bagian bawah: lima lapis jalur angka digambar isometrik, dengan jalur kedua kalibrasi:hitung-ulang yang kembali ke lapis validator.</desc>

  <defs>
    <style>
      /* ══════════════════════════════════════════════════════════════════
         PALET — SATU-SATUNYA TEMPAT WARNA DITENTUKAN DI BERKAS INI.
         Mau ganti tampilan? Ubah di sini saja, jangan di bawah.

           latar     dasar gelap, sekaligus penutup garis di belakang penanda
           judul     teks paling terang
           data      angka dan rumus
           teks      keterangan
           samar     keterangan tingkat dua
           redup     nomor urut, sumbu, label kecil
           titik     titik ukur, rusuk lapisan, penanda tahap
           aksen     jalur kedua dan penekanan (amber instrumen)
           lolos     pita toleransi
           gagal     titik yang |error|+U-nya melewati batas

         Tiga muka isometrik memakai terang yang berbeda supaya bentuknya
         terbaca tanpa perlu bayangan: atas paling terang, kiri sedang,
         kanan paling gelap.
         ══════════════════════════════════════════════════════════════════ */
      .latar    { fill: #f7f5ef; }
      .judul    { fill: #12171f; }
      .data     { fill: #2f4a6d; }
      .teks     { fill: #4b5563; }
      .samar    { fill: #6b7480; }
      .redup    { fill: #8d95a1; }
      .aksen    { fill: #9a6a24; }
      .lolos    { fill: #4a7345; }

      .muka-atas  { fill: #ffffff; }
      .muka-kiri  { fill: #e7e3d8; }
      .muka-kanan { fill: #d3cdbf; }

      .g-garis  { stroke: #c2bcae; }
      .g-halus  { stroke: #d8d3c6; }
      .g-nol    { stroke: #a8a293; }
      .g-titik  { stroke: #3f6ea8; }
      .g-aksen  { stroke: #9a6a24; }
      .g-lolos  { stroke: #4a7345; }
      .g-gagal  { stroke: #b0511f; }
      .f-titik  { fill:   #3f6ea8; }
      .f-gagal  { fill:   #b0511f; }
      .f-pita   { fill:   #4a7345; }
      /* ══════════════════════════════════════════════════════════════════ */

      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

      /* Gerak di berkas ini HIASAN semua, dan itu aturan yang ditegakkan:
         tidak ada satu pun teks, angka, atau bidang yang baru terlihat karena
         animasi. Versi lama memakai animasi masuk dari opacity 0 dengan
         fill-mode both — begitu animasinya tidak dijalankan di render GitHub,
         SELURUH teks banner hilang, diam-diam, tanpa error. */
      @keyframes sapu  { 0% { transform: translateX(0); } 100% { transform: translateX(456px); } }
      @keyframes tera  { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes turun {   0% { transform: translateY(0);     opacity: 0; }
                          10% { opacity: 1; }
                          90% { opacity: 1; }
                         100% { transform: translateY(404px); opacity: 0; } }
      @keyframes putus { to { stroke-dashoffset: -20; } }

      .sapu  { animation: sapu 7s cubic-bezier(.45,0,.55,1) infinite; }
      .tera  { animation: tera 3.4s ease-in-out infinite; }
      .turun { animation: turun 6s cubic-bezier(.5,0,.5,1) infinite; }
      .putus { animation: putus 1.6s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .sapu, .tera, .putus { animation: none; }
        .turun { animation: none; opacity: 1; }
      }
    </style>

    <pattern id="milimeter" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#2f4a6d" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="milimeterBesar" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 H0 V100" fill="none" stroke="#2f4a6d" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>

    <linearGradient id="sorot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2f4a6d" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#2f4a6d" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2f4a6d" stop-opacity="0"/>
    </linearGradient>

    <marker id="ujung" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a6a24"/>
    </marker>
  </defs>

  <rect class="latar" width="1200" height="780"/>
  <rect width="1200" height="780" fill="url(#milimeter)"/>
  <rect width="1200" height="780" fill="url(#milimeterBesar)"/>

  <!-- ═══════════════════ ATAS — identitas dan kurva kalibrasi ═══════════════════ -->

  <g transform="translate(64, 92)">
    <text class="mono aksen" x="0" y="0" font-size="11.5" letter-spacing="3.2">LK-285-IDN</text>
    <line class="g-aksen" x1="98" y1="-4" x2="150" y2="-4" stroke-opacity="0.4"/>
    <text class="mono samar" x="160" y="0" font-size="11.5" letter-spacing="1.6">LAB TERAKREDITASI</text>

    <text class="sans judul" x="-2" y="52" font-size="43" font-weight="650" letter-spacing="-0.9">SIDIK Calibration API</text>
    <text class="sans teks"  x="0"  y="84" font-size="15.5">Backend kalibrasi alat ukur dan sertifikat digital — PT Sidik</text>

    <line class="g-halus" x1="0" y1="110" x2="470" y2="110"/>

    <text class="mono samar" x="0" y="132" font-size="12.5">
      <tspan class="data">U = k·u_c</tspan><tspan fill="#a8a293">   ·   </tspan>k = 2<tspan fill="#a8a293">   ·   </tspan>JCGM 100:2008<tspan fill="#a8a293">   ·   </tspan>ILAC-G8
    </text>
  </g>

  <g>
    <rect class="f-pita" x="646" y="106" width="454" height="96" fill-opacity="0.10"/>
    <line class="g-lolos" x1="646" y1="106" x2="1100" y2="106" stroke-opacity="0.45"/>
    <line class="g-lolos" x1="646" y1="202" x2="1100" y2="202" stroke-opacity="0.45"/>
    <text class="mono lolos" x="1100" y="100" font-size="10" text-anchor="end" letter-spacing="1.2">BATAS TOLERANSI</text>

    <line class="g-nol" x1="646" y1="154" x2="1100" y2="154" stroke-dasharray="3 4"/>
    <text class="mono redup" x="638" y="158" font-size="10.5" text-anchor="end">0</text>

    <line class="g-garis" x1="646" y1="64" x2="646" y2="230"/>
    <line class="g-garis" x1="646" y1="230" x2="1100" y2="230"/>
    <text class="mono redup" x="646"  y="248" font-size="10" letter-spacing="1.2">TITIK UKUR</text>
    <text class="mono redup" x="1100" y="248" font-size="10" text-anchor="end" letter-spacing="1.2">error ± U</text>

    <g class="g-titik f-titik" stroke-width="1.4">
      <g><line x1="706" y1="122" x2="706" y2="158"/><line x1="701" y1="122" x2="711" y2="122"/><line x1="701" y1="158" x2="711" y2="158"/><circle cx="706" cy="140" r="3.4" stroke="none"/></g>
      <g><line x1="781" y1="148" x2="781" y2="176"/><line x1="776" y1="148" x2="786" y2="148"/><line x1="776" y1="176" x2="786" y2="176"/><circle cx="781" cy="162" r="3.4" stroke="none"/></g>
      <g><line x1="856" y1="112" x2="856" y2="152"/><line x1="851" y1="112" x2="861" y2="112"/><line x1="851" y1="152" x2="861" y2="152"/><circle cx="856" cy="132" r="3.4" stroke="none"/></g>
      <g><line x1="931" y1="147" x2="931" y2="171"/><line x1="926" y1="147" x2="936" y2="147"/><line x1="926" y1="171" x2="936" y2="171"/><circle cx="931" cy="159" r="3.4" stroke="none"/></g>
      <g><line x1="1081" y1="134" x2="1081" y2="164"/><line x1="1076" y1="134" x2="1086" y2="134"/><line x1="1076" y1="164" x2="1086" y2="164"/><circle cx="1081" cy="149" r="3.4" stroke="none"/></g>
    </g>

    <g class="g-gagal f-gagal" stroke-width="1.6">
      <line x1="1006" y1="184" x2="1006" y2="216"/>
      <line x1="1001" y1="184" x2="1011" y2="184"/>
      <line x1="1001" y1="216" x2="1011" y2="216"/>
      <circle class="tera" cx="1006" cy="200" r="3.8" stroke="none"/>
    </g>
    <text class="mono f-gagal" x="1006" y="228" font-size="9.5" text-anchor="middle">|e|+U &gt; batas</text>

    <rect class="sapu" x="646" y="64" width="44" height="166" fill="url(#sorot)"/>
  </g>

  <line class="g-halus" x1="64" y1="286" x2="1136" y2="286"/>

  <!-- ═══════════════════ BAWAH — jalur angka, isometrik ═══════════════════

       Tiap lapis satu bidang isometrik: setengah-lebar 130, setengah-tinggi 52,
       tebal 10. Digambar dari lapis TERATAS ke terbawah supaya yang di bawah
       menutupi yang di atas — itu yang membuat tumpukannya terbaca punya
       kedalaman, bukan sekadar lima belah ketupat berjajar.
       ══════════════════════════════════════════════════════════════════════ -->

  <g>
    <text class="mono redup" x="64"   y="330" font-size="10.5" letter-spacing="2.6">JALUR ANGKA — PEMBACAAN MENTAH KE SERTIFIKAT</text>
    <text class="mono redup" x="1136" y="330" font-size="10.5" text-anchor="end">guarded acceptance: |error| + U masuk toleransi</text>

    <line class="g-titik" x1="300" y1="330" x2="300" y2="740" stroke-opacity="0.22" stroke-dasharray="2 6"/>

    <g>
      <path class="muka-kiri"  d="M 170 388 L 300 440 L 300 450 L 170 398 Z"/>
      <path class="muka-kanan" d="M 300 440 L 430 388 L 430 398 L 300 450 Z"/>
      <path class="muka-atas"  d="M 170 388 L 300 336 L 430 388 L 300 440 Z" fill-opacity="0.92"/>
      <path class="g-titik" d="M 170 388 L 300 336 L 430 388 L 300 440 Z" fill="none" stroke-opacity="0.55"/>
      <line class="g-titik" x1="170" y1="388" x2="170" y2="398" stroke-opacity="0.35"/>
      <line class="g-titik" x1="430" y1="388" x2="430" y2="398" stroke-opacity="0.35"/>
      <line class="g-titik" x1="300" y1="440" x2="300" y2="450" stroke-opacity="0.35"/>

      <line class="g-garis" x1="430" y1="388" x2="524" y2="388"/>
      <circle class="f-titik" cx="430" cy="388" r="2.6"/>
      <text class="mono redup" x="540" y="378" font-size="10">01</text>
      <text class="mono judul" x="566" y="378" font-size="13" font-weight="600">raw_measurements</text>
      <text class="sans teks"  x="540" y="398" font-size="11.5">peran_sensor · sensor_ke · tahap — blok tingkat-sesi ke spesifikasi_alat</text>
    </g>

    <g>
      <path class="muka-kiri"  d="M 170 464 L 300 516 L 300 526 L 170 474 Z"/>
      <path class="muka-kanan" d="M 300 516 L 430 464 L 430 474 L 300 526 Z"/>
      <path class="muka-atas"  d="M 170 464 L 300 412 L 430 464 L 300 516 Z" fill-opacity="0.92"/>
      <path class="g-titik" d="M 170 464 L 300 412 L 430 464 L 300 516 Z" fill="none" stroke-opacity="0.55"/>
      <line class="g-titik" x1="170" y1="464" x2="170" y2="474" stroke-opacity="0.35"/>
      <line class="g-titik" x1="430" y1="464" x2="430" y2="474" stroke-opacity="0.35"/>
      <line class="g-titik" x1="300" y1="516" x2="300" y2="526" stroke-opacity="0.35"/>

      <line class="g-garis" x1="430" y1="464" x2="524" y2="464"/>
      <circle class="f-titik" cx="430" cy="464" r="2.6"/>
      <text class="mono redup" x="540" y="454" font-size="10">02</text>
      <text class="mono judul" x="566" y="454" font-size="13" font-weight="600">GumCalculator</text>
      <text class="mono data"  x="540" y="474" font-size="11.5">Type A + Type B → u_c → U = k·u_c</text>
      <text class="sans samar" x="540" y="491" font-size="11">Welch–Satterthwaite, k dikunci 2</text>
    </g>

    <g>
      <path class="muka-kiri"  d="M 170 540 L 300 592 L 300 602 L 170 550 Z"/>
      <path class="muka-kanan" d="M 300 592 L 430 540 L 430 550 L 300 602 Z"/>
      <path class="muka-atas"  d="M 170 540 L 300 488 L 430 540 L 300 592 Z" fill-opacity="0.92"/>
      <path class="g-aksen" d="M 170 540 L 300 488 L 430 540 L 300 592 Z" fill="none" stroke-opacity="0.6"/>
      <line class="g-aksen" x1="170" y1="540" x2="170" y2="550" stroke-opacity="0.4"/>
      <line class="g-aksen" x1="430" y1="540" x2="430" y2="550" stroke-opacity="0.4"/>
      <line class="g-aksen" x1="300" y1="592" x2="300" y2="602" stroke-opacity="0.4"/>

      <line class="g-garis" x1="430" y1="540" x2="524" y2="540"/>
      <circle class="aksen" cx="430" cy="540" r="2.6"/>
      <text class="mono redup" x="540" y="530" font-size="10">03</text>
      <text class="mono judul" x="566" y="530" font-size="13" font-weight="600">uncertainty_calculations</text>
      <text class="sans teks"  x="540" y="550" font-size="11.5">disimpan — tidak pernah dihitung ulang saat dibaca</text>
      <text class="sans samar" x="540" y="567" font-size="11">sertifikat lima tahun lalu tetap sama angkanya</text>
    </g>

    <g>
      <path class="muka-kiri"  d="M 170 616 L 300 668 L 300 678 L 170 626 Z"/>
      <path class="muka-kanan" d="M 300 668 L 430 616 L 430 626 L 300 678 Z"/>
      <path class="muka-atas"  d="M 170 616 L 300 564 L 430 616 L 300 668 Z" fill-opacity="0.92"/>
      <path class="g-titik" d="M 170 616 L 300 564 L 430 616 L 300 668 Z" fill="none" stroke-opacity="0.55"/>
      <line class="g-titik" x1="170" y1="616" x2="170" y2="626" stroke-opacity="0.35"/>
      <line class="g-titik" x1="430" y1="616" x2="430" y2="626" stroke-opacity="0.35"/>
      <line class="g-titik" x1="300" y1="668" x2="300" y2="678" stroke-opacity="0.35"/>

      <line class="g-garis" x1="430" y1="616" x2="524" y2="616"/>
      <circle class="f-titik" cx="430" cy="616" r="2.6"/>
      <text class="mono redup" x="540" y="606" font-size="10">04</text>
      <text class="mono judul" x="566" y="606" font-size="13" font-weight="600">CalibrationValidator</text>
      <text class="sans teks"  x="540" y="626" font-size="11.5">sebelum terbit: hitung ULANG dari mentah, adu ke yang tersimpan</text>
      <text class="mono aksen" x="540" y="643" font-size="11">error · peringatan · info</text>
    </g>

    <g>
      <path class="muka-kiri"  d="M 170 692 L 300 744 L 300 754 L 170 702 Z"/>
      <path class="muka-kanan" d="M 300 744 L 430 692 L 430 702 L 300 754 Z"/>
      <path class="muka-atas"  d="M 170 692 L 300 640 L 430 692 L 300 744 Z" fill-opacity="0.92"/>
      <path class="g-titik" d="M 170 692 L 300 640 L 430 692 L 300 744 Z" fill="none" stroke-opacity="0.55"/>
      <line class="g-titik" x1="170" y1="692" x2="170" y2="702" stroke-opacity="0.35"/>
      <line class="g-titik" x1="430" y1="692" x2="430" y2="702" stroke-opacity="0.35"/>
      <line class="g-titik" x1="300" y1="744" x2="300" y2="754" stroke-opacity="0.35"/>

      <line class="g-garis" x1="430" y1="692" x2="524" y2="692"/>
      <circle class="f-titik" cx="430" cy="692" r="2.6"/>
      <text class="mono redup" x="540" y="682" font-size="10">05</text>
      <text class="mono judul" x="566" y="682" font-size="13" font-weight="600">Sertifikat</text>
      <text class="sans teks"  x="540" y="702" font-size="11.5">snapshot dibekukan → PDF (dompdf) + QR code</text>
      <text class="sans samar" x="540" y="719" font-size="11">verifikasi publik, tanpa login</text>
    </g>

    <circle class="turun f-titik" cx="300" cy="336" r="3.6"/>

    <path class="putus g-aksen" d="M 170 388 C 84 430, 84 574, 158 610"
          fill="none" stroke-opacity="0.7" stroke-width="1.4"
          stroke-dasharray="5 5" marker-end="url(#ujung)"/>
    <text class="mono aksen" x="64"  y="766" font-size="11">kalibrasi:hitung-ulang</text>
    <text class="sans samar" x="204" y="766" font-size="11">— jalur kedua yang menghitung hal yang sama; alat baru wajib menyambung ke dua-duanya</text>
  </g>
</svg>
