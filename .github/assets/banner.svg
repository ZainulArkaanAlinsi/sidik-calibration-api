<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SIDIK Calibration API - Backend kalibrasi alat ukur dan sertifikat digital PT Sidik">
  <title>SIDIK Calibration API</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="45%" stop-color="#141a3a"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="judul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="rounded"><rect x="0" y="0" width="1200" height="340" rx="22"/></clipPath>

    <style>
      .fam  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

      @keyframes geser    { to { transform: translateX(-300px); } }
      @keyframes sapu     { 0% { transform: translateX(-420px) skewX(-18deg); } 100% { transform: translateX(1620px) skewX(-18deg); } }
      @keyframes napas    { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @keyframes melayang { 0%,100% { transform: translateY(0); opacity: .3; } 50% { transform: translateY(-14px); opacity: .9; } }
      @keyframes kedip    { 0%,45% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes aurora   { 0% { transform: translateX(-180px); } 100% { transform: translateX(180px); } }

      .ombak  { animation: geser 5s linear infinite; }
      .ombak2 { animation: geser 8s linear infinite; }
      .sapu   { animation: sapu 7s ease-in-out infinite; }
      .aurora { animation: aurora 9s ease-in-out infinite alternate; }
      .titik  { animation: melayang 4s ease-in-out infinite; }
      .pulsa  { animation: napas 3s ease-in-out infinite; }
      .kursor { animation: kedip 1.1s step-end infinite; }

      /* Tidak ada animasi masuk di sini, dan itu disengaja: animasi sekali-jalan
         yang berangkat dari opacity 0 pernah bikin SELURUH teks banner hilang di
         GitHub — begitu animasinya tidak dijalankan, fill-mode both mengunci
         elemennya di keadaan awal, yaitu tak terlihat. Yang berputar di bawah ini
         semuanya hiasan: kalau tidak jalan, tidak ada isi yang ikut hilang. */

      @media (prefers-reduced-motion: reduce) {
        .ombak, .ombak2, .sapu, .aurora, .titik, .pulsa, .kursor { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect class="aurora" x="-200" y="-40" width="1600" height="420" fill="url(#aurora)"/>

    <g fill="#7dd3fc">
      <circle class="titik" cx="120"  cy="70"  r="2.5" style="animation-delay:0s"/>
      <circle class="titik" cx="300"  cy="46"  r="2"   style="animation-delay:.6s"/>
      <circle class="titik" cx="470"  cy="88"  r="1.8" style="animation-delay:1.2s"/>
      <circle class="titik" cx="700"  cy="54"  r="2.4" style="animation-delay:.3s"/>
      <circle class="titik" cx="905"  cy="92"  r="2"   style="animation-delay:1.6s"/>
      <circle class="titik" cx="1075" cy="60"  r="2.6" style="animation-delay:.9s"/>
      <circle class="titik" cx="205"  cy="258" r="2"   style="animation-delay:1.4s"/>
      <circle class="titik" cx="1010" cy="252" r="2.2" style="animation-delay:.5s"/>
    </g>

    <g opacity="0.85">
      <path class="ombak2" d="M -300 292 q 75 -22 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0"
            fill="none" stroke="url(#wave2)" stroke-width="2" stroke-opacity="0.45"/>
      <path class="ombak"  d="M -300 300 q 75 -34 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0"
            fill="none" stroke="url(#wave1)" stroke-width="3" filter="url(#glow)"/>
    </g>

    <g transform="translate(64, 96)">
      <g>
        <rect x="0" y="-34" width="238" height="26" rx="13" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/>
        <circle class="pulsa" cx="17" cy="-21" r="4" fill="#22d3ee"/>
        <text class="mono" x="32" y="-16" font-size="12" fill="#a5f3fc" letter-spacing="1.4">LK-285-IDN · TERAKREDITASI</text>
      </g>

      <text class="fam" x="0" y="42" font-size="56" font-weight="800" fill="url(#judul)" letter-spacing="-1.4">SIDIK Calibration API</text>

      <text class="fam" x="2" y="80" font-size="18" fill="#94a3b8">Backend kalibrasi alat ukur <tspan fill="#475569">·</tspan> sertifikat digital PT Sidik</text>

      <g transform="translate(2, 114)"><g>
        <text class="mono" x="0"   y="0" font-size="15" fill="#7dd3fc">u_c → U = k·u_c</text>
        <text class="mono" x="140" y="0" font-size="15" fill="#475569">|</text>
        <text class="mono" x="158" y="0" font-size="15" fill="#c4b5fd">k = 2</text>
        <text class="mono" x="215" y="0" font-size="15" fill="#475569">|</text>
        <text class="mono" x="233" y="0" font-size="15" fill="#86efac">JCGM 100:2008</text>
        <text class="mono" x="373" y="0" font-size="15" fill="#475569">|</text>
        <text class="mono" x="391" y="0" font-size="15" fill="#fca5a5">ILAC-G8</text>
        <rect class="kursor" x="472" y="-13" width="9" height="17" fill="#22d3ee"/>
      </g></g>
    </g>

    <g transform="translate(824, 108)"><g class="fam">
      <rect x="0"   y="0"  width="112" height="34" rx="17" fill="#ff2d20" fill-opacity="0.14" stroke="#ff2d20" stroke-opacity="0.45"/>
      <text x="56"  y="22" font-size="14" font-weight="600" fill="#fca5a5" text-anchor="middle">Laravel 13</text>

      <rect x="124" y="0"  width="112" height="34" rx="17" fill="#fdae4b" fill-opacity="0.14" stroke="#fdae4b" stroke-opacity="0.45"/>
      <text x="180" y="22" font-size="14" font-weight="600" fill="#fcd34d" text-anchor="middle">Filament 5</text>

      <rect x="0"   y="46" width="112" height="34" rx="17" fill="#777bb4" fill-opacity="0.18" stroke="#8b90d6" stroke-opacity="0.45"/>
      <text x="56"  y="68" font-size="14" font-weight="600" fill="#c7d2fe" text-anchor="middle">PHP 8.4</text>

      <rect x="124" y="46" width="112" height="34" rx="17" fill="#4479a1" fill-opacity="0.20" stroke="#60a5fa" stroke-opacity="0.45"/>
      <text x="180" y="68" font-size="14" font-weight="600" fill="#bfdbfe" text-anchor="middle">MySQL 8</text>
    </g></g>

    <rect class="sapu" x="0" y="-40" width="180" height="420" fill="url(#shine)"/>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="22" fill="none" stroke="#334155" stroke-opacity="0.7"/>
  </g>
</svg>
