# Blueprint Render — sekali impor, service-nya kebentuk lengkap sama semua
# environment variable-nya.
#
# Yang ditandai `sync: false` sengaja NGGAK punya nilai di sini: itu rahasia
# (kunci aplikasi, password database, kunci Gemini) dan berkas ini masuk git.
# Render bakal nanyain satu-satu waktu blueprint diimpor.
#
# Database-nya nggak ikut didefinisikan di sini karena Render nggak punya MySQL
# gratis — yang gratis cuma PostgreSQL, dan itu pun kedaluwarsa. MySQL-nya
# nebeng Aiven (gratis selamanya, 1 GB). Lihat docs/deploy-gratis-render.md.

services:
  - type: web
    name: sidik-calibration-api
    runtime: docker
    plan: free
    # Singapura = region Render yang paling deket ke Indonesia.
    region: singapore
    dockerfilePath: ./Dockerfile
    # Laravel udah nyediain /up sendiri (didaftarin di bootstrap/app.php).
    # Dipakai Render buat mastiin container-nya beneran hidup, bukan cuma
    # nyala tapi error 500.
    healthCheckPath: /up
    # SENGAJA false, dan ini kebalikan dari nilai sebelumnya.
    #
    # Waktu render.yaml ini ditulis, GitHub App Render belum kepasang, jadi
    # `true` nggak ada efeknya sama sekali. Sekarang App-nya kepasang — dan
    # riwayat deploy 23 Agt 2026 nunjukin akibatnya: tiap push memicu DUA
    # build, satu "New commit via Auto-Deploy" dan satu lagi "Triggered via
    # Deploy Hook" dari workflow.
    #
    # Bukan cuma boros jatah build gratis. Yang lewat Auto-Deploy naik TANPA
    # nunggu test — persis yang bikin urutan "test dulu, baru deploy" di
    # .github/workflows/tes.yml jadi sia-sia, karena commit yang test-nya merah
    # tetap nyampe server yang dipakai teknisi lewat jalur satunya.
    #
    # Satu jalur saja: Deploy Hook, diketuk workflow SESUDAH test hijau.
    autoDeploy: false
    envVars:
      - key: APP_NAME
        value: SIDIK Calibration
      - key: APP_ENV
        value: production
      # WAJIB false di produksi. `true` bikin halaman error nampilin isi .env
      # lengkap — termasuk password database — ke siapa pun yang kebetulan
      # kena error.
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_LOCALE
        value: id
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # Bikin nilainya: php artisan key:generate --show
      - key: APP_KEY
        sync: false

      # Realtime sync MATI di produksi, dan itu ditulis EKSPLISIT di sini.
      #
      # `laravel/reverb` terpasang di composer.json, tapi blueprint ini nggak
      # pernah punya `BROADCAST_CONNECTION` maupun `REVERB_*` — jadi produksi
      # jatuh ke bawaan `log`: event broadcast ditulis ke berkas log dan nggak
      # pernah nyampe ke klien. Nggak ada error; pengguna cuma nggak pernah
      # lihat pembaruan sampai dia menarik data manual.
      #
      # Nilainya nggak berubah dari yang selama ini berlaku. Yang berubah:
      # keadaannya sekarang KEPUTUSAN yang kebaca waktu blueprint ini dibuka,
      # bukan bawaan yang kebetulan. Statusnya juga kelihatan dari luar lewat
      # `GET /api/health` -> `realtime`.
      #
      # Buat menyalakannya, TIGA hal harus jalan bareng — satu saja kurang,
      # gagalnya senyap lagi:
      #   1. `BROADCAST_CONNECTION=reverb` di sini;
      #   2. `REVERB_APP_ID` / `REVERB_APP_KEY` / `REVERB_APP_SECRET`
      #      (`sync: false`, diisi lewat dashboard);
      #   3. `php artisan reverb:start` dijalanin di container — `entrypoint.sh`
      #      sekarang cuma nge-loop `queue:work` & `schedule:work`.
      #
      # Yang belum dipastikan dan BUKAN urusan kode: apakah plan Render yang
      # dipakai sanggup menahan satu proses WebSocket panjang lagi di container
      # yang sama. Lihat docs/pertanyaan-lab-audit-2026-09.md T3.
      - key: BROADCAST_CONNECTION
        value: log

      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Isi ca.pem dari Aiven, dalam base64 satu baris:
      #   base64 -i ca.pem | tr -d '\n'
      - key: DB_SSL_CA_B64
        sync: false

      # Semuanya numpang tabel di MySQL — biar nggak perlu Redis, yang di
      # paket gratis emang nggak ada.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Disk container Render itu sementara — kehapus tiap deploy DAN tiap
      # container bangun ulang. Yang ikut hilang: foto lembar kerja, tanda
      # tangan, logo organisasi, PDF sertifikat.
      #
      # Bacanya begini: selama nilainya `local`, tiap kali kode di-push, foto
      # lembar kerja yang sudah diunggah teknisi hilang. Itu bukan risiko yang
      # nunggu kejadian — itu akibat rutin dari kerja normal.
      #
      # Ganti ke `s3` begitu bucket R2 dibuat dan AWS_* di bawah diisi. Nggak
      # ada kode yang berubah: Laravel bicara ke R2 lewat protokol S3 yang
      # sama, dan adapternya (league/flysystem-aws-s3-v3) sudah terpasang.
      - key: FILESYSTEM_DISK
        value: local

      # Saklar pemindahan berkas awet (PDF sertifikat, tanda tangan, dokumen
      # Folder Manager, foto titik ukur) ke object storage.
      #
      # `local` = disk container, kehapus tiap deploy. `s3` = bucket R2 di
      # bawah. JANGAN digeser sebelum keempat AWS_* terisi dan berkas lama
      # disalin — kunci di bucket harus sama persis dengan isi kolom
      # `pdf_path`/`tanda_tangan_path`/`path` di database.
      #
      # Ini saklarnya, BUKAN FILESYSTEM_DISK. Yang terakhir itu cuma dibaca
      # baris `'default'` di config/filesystems.php, dan nggak ada satu pun
      # pemakaian Storage:: di app/ yang memakai disk default.
      #
      # ## Kenapa `sync: false`, bukan `value: local`
      #
      # 1 Sep 2026, kejadian nyata: saklarnya digeser ke `s3` di dashboard,
      # arsipnya pindah ke R2, `/api/health` melaporkan `arsip.awet: true`.
      # Deploy berikutnya menyinkronkan blueprint ini, dan `value: local`
      # MENIMPA BALIK setelan itu. Produksi diam-diam kembali menulis ke disk
      # container yang kehapus tiap deploy — tanpa satu pun error, dan yang
      # kelihatan cuma satu huruf berubah di endpoint health.
      #
      # Keempat AWS_* di bawah selamat justru karena `sync: false`. Bedanya
      # bukan soal rahasia atau bukan: `value:` artinya "blueprint yang
      # menentukan", dan ARSIP_DRIVER itu KEPUTUSAN OPERASIONAL — tergantung
      # bucket sudah ada atau belum, berkas lama sudah disalin atau belum.
      # Blueprint nggak bisa tahu itu, jadi dia nggak boleh memutuskan.
      #
      # Dikosongkan waktu impor blueprint tetap aman: `env('ARSIP_DRIVER',
      # 'local')` di config/filesystems.php jatuh ke `local`, persis bawaan
      # yang lama.
      - key: ARSIP_DRIVER
        sync: false

      # Cloudflare R2 — gratis 10 GB, dipakai kalau ARSIP_DRIVER=s3.
      #
      # Namanya AWS_* karena R2 bicara protokol S3; ini BUKAN Amazon dan nggak
      # perlu akun AWS. Bikinnya: dash.cloudflare.com → R2 → Create bucket,
      # lalu "Manage R2 API Tokens" buat kunci aksesnya.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      # Bentuknya: https://<account-id>.r2.cloudflarestorage.com
      # TANPA nama bucket di belakangnya.
      - key: AWS_ENDPOINT
        sync: false
      # R2 nggak punya konsep region. "auto" itu nilai yang dia minta.
      - key: AWS_DEFAULT_REGION
        value: auto
      # Kalau unggahan ditolak dengan keluhan soal nama bucket, balik nilai ini
      # ke "true" — dua gaya penamaan sama-sama dilayani R2, dan yang cocok
      # tergantung cara bucket-nya dibikin.
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
      # Cuma perlu kalau bucket-nya dibikin publik dan berkasnya mau diakses
      # lewat URL langsung. Kosongin kalau semua akses lewat backend.
      - key: AWS_URL
        sync: false

      - key: VISION_DRIVER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false

      # Direktori perusahaan — cari nama & alamat PT dari sumber LUAR waktu
      # teknisi mendaftarkan pelanggan yang belum ada di master lab.
      #
      # Pencarian di master lab dan ketik tangan SELALU jalan penuh, apa pun
      # isi tiga baris di bawah. Yang disetel di sini cuma lapis tambahannya.
      #
      # `osm` (bawaan) = OpenStreetMap lewat Nominatim: gratis, tanpa API key,
      # NOL TAGIHAN. Bayarannya cakupan lebih tipis — cuma tempat yang pernah
      # dipetakan sukarelawan.
      # `google` = Places API: cakupan pabrik Indonesia lebih tebal, tapi butuh
      # key DAN ditagih per request begitu kuota bebas bulanannya lewat.
      # `auto` = berlapis: Google duluan kalau DIREKTORI_PERUSAHAAN_KEY di
      # bawah terisi, OpenStreetMap di belakangnya.
      #
      # Dipindah ke `osm` 1 Sep 2026 atas keputusan pemilik proyek: nol
      # tagihan. Keputusannya sendiri sudah diambil 31 Agt 2026, cuma nilai di
      # sini yang tertinggal di `auto` — dan selama itu Places tetap ditembak.
      # Pindah balik ke `google`/`auto` = menyalakan lagi jalur yang ditagih;
      # kalau memang mau, pasang batas kuotanya di konsol Google dulu, jangan
      # cuma andalkan throttle 30/menit di server.
      - key: DIREKTORI_PERUSAHAAN_DRIVER
        value: osm

      # Nominatim menolak klien yang nggak menyebut dirinya, dan yang diblokir
      # alamat IP service ini — bukan satu request. Sejak DRIVER=osm jadi
      # bawaan, baris ini satu-satunya yang menjaga jalur direktori tetap
      # hidup: nggak ada lapis Google di belakangnya yang menampung kalau
      # Nominatim menutup pintu. Makanya cara menghubunginya ikut disebut,
      # bukan cuma nama aplikasinya.
      - key: DIREKTORI_PERUSAHAAN_USER_AGENT
        value: SidikCalibration/1.0 (+https://github.com/ZainulArkaanAlinsi/sidik-calibration-api)

      # Cakupan pabrik Indonesia paling tebal ada di sini, jadi ini yang
      # dipakai duluan waktu DRIVER=auto. Text Search punya kuota bebas
      # bulanan (5.000 panggilan/bulan sejak Mar 2025) — jauh di atas
      # pemakaian satu lab, yang cuma menembak waktu teknisi menekan cari.
      #
      # JEBAKAN KONSOL GOOGLE: key ini dipanggil dari SERVER, jadi pembatasan
      # aplikasinya JANGAN disetel ke "Android apps"/"HTTP referrers".
      # Instingnya begitu karena ini proyek mobile, dan hasilnya semua
      # permintaan ditolak 403.
      - key: DIREKTORI_PERUSAHAAN_KEY
        sync: false

      # Nyalain SEKALI pas deploy pertama biar master data (organisasi,
      # kemampuan kalibrasi, standar) keisi, terus balikin ke "false".
      # Ditinggal "true" bikin data uji ketimpa tiap container bangun.
      #
      # Sandi akun TETAP AMAN kalaupun ini keteken "true" lagi: seeder cuma
      # masang sandi ke akun yang baru kebentuk, nggak pernah nyetel ulang yang
      # sudah ada. Yang ketimpa tetap datanya, bukan kredensialnya.
      - key: SEED_ON_BOOT
        value: "false"

      # Sandi awal buat akun yang dibentuk seeder di atas. Dikosongin juga
      # aman — seeder bikin sandi acak dan nyetak sekali ke log deploy buat
      # disalin. Yang nggak boleh cuma satu: kepakainya `rahasia123`, karena
      # sandi itu tercetak di repo yang publik ini.
      - key: SEED_ADMIN_PASSWORD
        sync: false
